name: ci

# Thin hub workflow. Every job delegates to an ops/ci entrypoint used locally.
# The hub compiles its Rust CLI and wire crate; member repositories run their
# own workflows. Hosted security provisions checksum-pinned scanners before it
# delegates to the exact local entrypoint. Jankurai remains a fail-closed local
# audit: the installed 1.6.11 binary is a machine-local path build, so hosted
# registration is blocked until an authoritative portable artifact is pinned.
# Third-party actions are pinned to full SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Fast
        run: bash ops/ci/fast.sh

  required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Required
        run: bash ops/ci/required.sh

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.95.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Family lock
        run: bash ops/ci/contract.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-deny@0.19.8
          fallback: none
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: zizmor@1.25.2
          fallback: none
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Security
        run: bash ops/ci/security.sh
