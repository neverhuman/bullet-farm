# Canonical template: bullet-farm/publication/root/.github/workflows/publication.yml
# This bootstrap proves publication integrity only. Member/family and certification
# inventories must be activated separately before claiming complete CI.
name: Publication bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication_integrity:
    name: Exact publication integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks 8.21.2
        run: bash bullet-farm/ops/ci/install-gitleaks.sh
      - name: Scan aggregate source before building
        run: bash bullet-farm/publication/ci.sh source-scan
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.95.0
      - name: Prove publication and reconstruct exact split checkouts
        run: bash bullet-farm/publication/ci.sh prove
      - name: Retain sanitized bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bullet-publication-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publication_required:
    name: Publication bootstrap required
    needs: [publication_integrity]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject missing or unsuccessful publication proof
        env:
          INTEGRITY_RESULT: ${{ needs.publication_integrity.result }}
        shell: bash
        run: |
          if [[ "$INTEGRITY_RESULT" != success ]]; then
            echo '::error::publication integrity did not succeed'
            exit 1
          fi
