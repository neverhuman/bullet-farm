# Generated artifacts that must be repaired from their source, never hand-edited.
[[zone]]
path = "family.lock"
source = "repos.manifest.toml + signed immutable member tags"
command = "cargo run --locked --quiet --bin bullet-family -- lock generate --tag <version>"
read_only = true

[[zone]]
path = ".fusion/"
source = "repos.manifest.toml + family.lock + exact member checkouts"
command = "bash scripts/fuse.sh --source local"
read_only = true

[[zone]]
path = "contracts/v1alpha1/schema-bundle.json"
source = "contracts/v1alpha1/contract-catalog.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "contracts/v1alpha1/bundle-manifest.json"
source = "contracts/v1alpha1/contract-catalog.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "contracts/generated/"
source = "contracts/v1alpha1/contract-catalog.json + policy/v1alpha1/invariant-registry.json + policy/v1alpha1/policy-template.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "policy/v1alpha1/policy.json"
source = "policy/v1alpha1/policy-template.json + policy/v1alpha1/invariant-registry.json + contracts/v1alpha1/contract-catalog.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/hostile/cases/"
source = "crates/bullet-wire/src/contract_tool.rs"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/hostile/fixture-manifest.json"
source = "fixtures/hostile/team-original.bin"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/canonical/canonical-golden.json"
source = "crates/bullet-wire/src/contract_tool.rs"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/canonical/authority-golden.json"
source = "crates/bullet-wire/src/contract_tool.rs"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/canonical/launch-grant-golden.json"
source = "crates/bullet-wire/src/contract_tool/launch.rs"
command = "just contract-generate"
read_only = true

[[zone]]
path = "docs/assurance/invariant-crosswalk.generated.md"
source = "policy/v1alpha1/invariant-registry.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "formal/traces/"
source = "formal/*.tla + formal/*.cfg + formal/toolchain.lock.json + formal/model-lock.json"
command = "just model-check"
read_only = true
