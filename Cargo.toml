[package]
name = "bullet-family"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Bullet Farm family coordination and onboarding CLI"

[workspace]
members = ["crates/bullet-wire"]
default-members = [".", "crates/bullet-wire"]
resolver = "3"

[dependencies]
blake3 = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.12"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["fs"] }

[lib]
name = "bullet_family"
path = "src/lib.rs"

[[bin]]
name = "bullet-family"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
